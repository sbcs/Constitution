<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica, Arial, sans-serif">
  <title>Hackathon Committee Hierarchy</title>
  <rect width="900" height="300" fill="#ffffff"/>

  <style>
    .lead   { fill: #1d4ed8; stroke: #1e3a8a; stroke-width: 1.5; }
    .member { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; }
    .line   { stroke: #334155; stroke-width: 1.6; fill: none; }
    .t-lead { fill: #ffffff; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .t-mem  { fill: #0f172a; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .t-sub  { fill: #475569; font-size: 12px; text-anchor: middle; }
    .t-subw { fill: #dbeafe; font-size: 12px; text-anchor: middle; }
  </style>

  <path class="line" d="M450 76 V100 M120 100 H780 M120 100 V124 M340 100 V124 M560 100 V124 M780 100 V124 M780 180 V204"/>

  <rect class="lead" x="345" y="20" width="210" height="56" rx="8"/>
  <text x="450" y="46" class="t-lead">Hackathon Director</text>
  <text x="450" y="64" class="t-subw">reports to SBCS President</text>

  <rect class="member" x="20" y="124" width="200" height="56" rx="8"/>
  <text x="120" y="150" class="t-mem">Communications Officers</text>
  <text x="120" y="168" class="t-sub">×2 · + SBCS Vice President</text>

  <rect class="member" x="240" y="124" width="200" height="56" rx="8"/>
  <text x="340" y="150" class="t-mem">Finance Officers</text>
  <text x="340" y="168" class="t-sub">×2 · + SBCS Treasurer</text>

  <rect class="member" x="460" y="124" width="200" height="56" rx="8"/>
  <text x="560" y="150" class="t-mem">Logistics Officers</text>
  <text x="560" y="168" class="t-sub">×2 · + SBCS Secretary</text>

  <rect class="member" x="680" y="124" width="200" height="56" rx="8"/>
  <text x="780" y="150" class="t-mem">Creative Director</text>
  <text x="780" y="168" class="t-sub">posts via SBUHacks accounts</text>

  <rect class="member" x="680" y="204" width="200" height="56" rx="8"/>
  <text x="780" y="230" class="t-mem">Creative Officers</text>
  <text x="780" y="248" class="t-sub">×2</text>

  <text x="20" y="286" class="t-sub" style="text-anchor:start">Lines show reporting within the committee. Additional SBCS e-board contacts are listed in each box.</text>
</svg>
