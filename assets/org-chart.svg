<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>SBCS Organization Chart (2026-2027)</title>
  <rect width="1160" height="640" fill="#ffffff"/>

  <style>
    .core   { fill: #1d4ed8; stroke: #1e3a8a; stroke-width: 1.5; }
    .nonexec{ fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; }
    .reps   { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line   { stroke: #334155; stroke-width: 1.6; fill: none; }
    .t-core { fill: #ffffff; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .t-ne   { fill: #0f172a; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .t-sub  { fill: #475569; font-size: 12px; text-anchor: middle; }
    .t-subw { fill: #dbeafe; font-size: 12px; text-anchor: middle; }
    .t-leg  { fill: #0f172a; font-size: 13px; }
    .t-head { fill: #0f172a; font-size: 22px; font-weight: 700; text-anchor: middle; }
  </style>

  <text x="580" y="34" class="t-head">SBCS Organization Chart (2026-2027)</text>

  <!-- President to row 2 bus -->
  <path class="line" d="M580 112 V136 M22 136 H1030 M430 136 V160 M730 136 V160 M1030 136 V160"/>
  <!-- President's direct non-exec reports (bracket on the left) -->
  <path class="line" d="M22 136 V408 M22 188 H40 M22 408 H40"/>
  <!-- Hackathon Director -> Hackathon Committee -->
  <path class="line" d="M135 216 V280"/>
  <!-- Vice President bracket -->
  <path class="line" d="M430 216 V244 H317 V408 M317 308 H335 M317 408 H335"/>
  <!-- Secretary bracket -->
  <path class="line" d="M730 216 V244 H617 V508 M617 308 H635 M617 408 H635 M617 508 H635"/>
  <!-- Treasurer -> Event Coordinator -->
  <path class="line" d="M1030 216 V280"/>

  <!-- Row 1: President -->
  <rect class="core" x="480" y="56" width="200" height="56" rx="8"/>
  <text x="580" y="82" class="t-core">President</text>
  <text x="580" y="100" class="t-subw">Core 4 · delegates tasks</text>

  <!-- Row 2: Core 4 -->
  <rect class="core" x="335" y="160" width="190" height="56" rx="8"/>
  <text x="430" y="186" class="t-core">Vice President</text>
  <text x="430" y="204" class="t-subw">Core 4</text>

  <rect class="core" x="635" y="160" width="190" height="56" rx="8"/>
  <text x="730" y="186" class="t-core">Secretary</text>
  <text x="730" y="204" class="t-subw">Core 4</text>

  <rect class="core" x="935" y="160" width="190" height="56" rx="8"/>
  <text x="1030" y="186" class="t-core">Treasurer</text>
  <text x="1030" y="204" class="t-subw">Core 4</text>

  <!-- President's direct reports -->
  <rect class="nonexec" x="40" y="160" width="190" height="56" rx="8"/>
  <text x="135" y="186" class="t-ne">Hackathon Director</text>
  <text x="135" y="204" class="t-sub">leads Hackathon Committee</text>

  <rect class="nonexec" x="40" y="280" width="190" height="56" rx="8"/>
  <text x="135" y="306" class="t-ne">Hackathon Committee</text>
  <text x="135" y="324" class="t-sub">9 officers · Article V §IX</text>

  <rect class="nonexec" x="40" y="380" width="190" height="56" rx="8"/>
  <text x="135" y="406" class="t-ne">SIG Board Members</text>
  <text x="135" y="424" class="t-sub">Special Interest Groups</text>

  <!-- Vice President reports -->
  <rect class="nonexec" x="335" y="280" width="190" height="56" rx="8"/>
  <text x="430" y="306" class="t-ne">Web Coordinator</text>
  <text x="430" y="324" class="t-sub">sbcs.io + event sites</text>

  <rect class="nonexec" x="335" y="380" width="190" height="56" rx="8"/>
  <text x="430" y="406" class="t-ne">Project Quack Director</text>
  <text x="430" y="424" class="t-sub">mentorship program</text>

  <!-- Project Quack Director -> Project Quack Mentors -->
  <path class="line" d="M430 436 V480"/>
  <rect class="nonexec" x="335" y="480" width="190" height="56" rx="8"/>
  <text x="430" y="506" class="t-ne">Project Quack Mentors</text>
  <text x="430" y="524" class="t-sub">mentor project teams</text>

  <path class="line" d="M430 436 V480"/>
  <rect class="nonexec" x="335" y="480" width="190" height="56" rx="8"/>
  <text x="430" y="506" class="t-ne">Project Quack Mentors</text>
  <text x="430" y="524" class="t-sub">mentor project teams</text>

  <!-- Secretary reports -->
  <rect class="nonexec" x="635" y="280" width="190" height="56" rx="8"/>
  <text x="730" y="306" class="t-ne">Social Media Manager</text>
  <text x="730" y="324" class="t-sub">Instagram · LinkedIn · website</text>

  <rect class="nonexec" x="635" y="380" width="190" height="56" rx="8"/>
  <text x="730" y="406" class="t-ne">Graphic Designers</text>
  <text x="730" y="424" class="t-sub">×2 · flyers, merch, web assets</text>

  <rect class="nonexec" x="635" y="480" width="190" height="56" rx="8"/>
  <text x="730" y="506" class="t-ne">Writing Specialist</text>
  <text x="730" y="524" class="t-sub">newsletters · major recaps</text>

  <!-- Treasurer reports -->
  <rect class="nonexec" x="935" y="280" width="190" height="56" rx="8"/>
  <text x="1030" y="306" class="t-ne">Event Coordinator</text>
  <text x="1030" y="324" class="t-sub">25Live · SBEngaged · SEA</text>

  <!-- Reps -->
  <rect class="reps" x="860" y="380" width="265" height="72" rx="8"/>
  <text x="992" y="406" class="t-ne">Reps (extended e-board)</text>
  <text x="992" y="424" class="t-sub">chosen by interview each September;</text>
  <text x="992" y="440" class="t-sub">assist with event planning and hosting</text>

  <!-- Legend -->
  <rect class="core" x="40" y="572" width="22" height="16" rx="3"/>
  <text x="70" y="585" class="t-leg">Core 4 (executive board)</text>
  <rect class="nonexec" x="260" y="572" width="22" height="16" rx="3"/>
  <text x="290" y="585" class="t-leg">Non-executive board</text>
  <rect class="reps" x="460" y="572" width="22" height="16" rx="3"/>
  <text x="490" y="585" class="t-leg">Reps</text>
  <text x="40" y="614" class="t-sub" style="text-anchor:start">Lines show who reports to whom. The President delegates tasks; each e-board member makes sure the roles under them complete their tasks on schedule.</text>
</svg>
